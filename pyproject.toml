[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiankunpt"
version = "0.1.0rc1"
description = "Distributed semistochastic Epstein–Nesbet perturbation theory on GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "QiankunPT contributors"}]
keywords = ["quantum chemistry", "Epstein-Nesbet", "semistochastic PT2", "distributed computing", "CUDA", "selected CI", "CountSketch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.23", "torch>=2.3", "ninja>=1.11"]

[project.urls]
Repository = "https://github.com/fulz024/QiankunPT"

[project.optional-dependencies]
test = ["pytest>=7"]
release = ["build>=1", "twine>=5"]

[project.scripts]
qiankunpt = "qiankunpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qiankunpt = ["py.typed", "_backend/cuda/*.cpp", "_backend/cuda/*.cu", "_backend/cuda/*.cuh", "_native/integrals.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires an NVIDIA GPU and CUDA development toolkit", "native: builds the CPU integral reader", "distributed: requires multiple GPUs and NCCL"]
